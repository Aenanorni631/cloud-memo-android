pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // This 'id' format is required for newer Gradle versions to find the plugin
    id("com.facebook.react.settings")
}

// These extensions help link your npm packages to the Android build
extensions.configure(com.facebook.react.ReactSettingsExtension) { settings ->
    settings.autolinkLibrariesWithApp()
}

include ':app'
rootProject.name = 'CloudMemo'

// Link the native modules helper script
apply from: file("../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); 
applyNativeModulesSettingsGradle(settings)
