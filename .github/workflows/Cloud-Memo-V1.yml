name: Cloud-Memo-V1
on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Build Android Base
        run: |
          cd android
          # Ensure the script is executable on the server
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Archive Base APK
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-Memo-Base
          path: android/app/build/outputs/apk/debug/app-debug.apk
